buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        if (findProject(':android') != null) {
            classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"
        }
    }
}

plugins {
    id 'com.diffplug.spotless' version '8.11.0'
}

// The code format (see config/eclipse-formatter.xml): `./gradlew spotlessApply` formats, `./gradlew build` fails on
// unformatted code (spotlessCheck).
spotless {
    java {
        target 'core/src/**/*.java', 'desktop/src/**/*.java', 'html/src/**/*.java', 'e2e/test/**/*.java'
        targetExclude 'html/src/**/emu/**' // vendored libGDX / box2dlights sources the GWT build needs
        eclipse('4.41').configFile('config/eclipse-formatter.xml') // pinned: an upgrade never reformats silently
        importOrder('', 'javax|java', '\\#') // IntelliJ's default: everything else, then java/javax, then static
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    version = '1.0'

    repositories {
        mavenCentral()
        google()
    }
}

def targetJava = (rootProject.property('javaVersion') as String).toInteger()

configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:deprecation'
        options.release = targetJava
    }
}
