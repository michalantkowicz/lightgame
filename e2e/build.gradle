// Regression tests: the real game played headlessly (see e2e/README.md) plus a few unit tests.
// Test code only - this module produces nothing that ships with the game.
//
//   ./gradlew e2e:test                          run all tests
//   ./gradlew e2e:test -Dgolden.update=true     re-record golden files (only when behaviour is meant to change)

sourceSets.main.java.srcDirs = []
sourceSets.test.java.srcDirs = ['test/']
sourceSets.test.resources.srcDirs = []

dependencies {
    testImplementation project(':core')
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1' // architecture tests (docs/code-quality-plan.md)
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def goldenDir = file('golden')

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = rootProject.file('android/assets') // the game loads its assets relative to this
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'golden.dir', goldenDir.absolutePath
    systemProperty 'golden.actual.dir', layout.buildDirectory.dir('golden-actual').get().asFile.absolutePath
    systemProperty 'golden.update', System.getProperty('golden.update', 'false')
    systemProperty 'repo.root', rootProject.projectDir.absolutePath // AssetsUpToDateTest reads the asset sources
    systemProperty 'architecture.update', System.getProperty('architecture.update', 'false')
    inputs.dir(file('architecture')).withPropertyName('architecture')
    inputs.dir(goldenDir).withPropertyName('goldens')
    inputs.dir(rootProject.file('android/assets')).withPropertyName('assets')
    // sources of the generated assets: a level saved in Tiled must re-run AssetsUpToDateTest (images/ is git-ignored)
    inputs.files(fileTree('../assets-src') { exclude 'tilesets/images/**' }).withPropertyName('assetSources')
    inputs.file(rootProject.file('tools/assets/pack.json')).withPropertyName('packJson')
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}

// Coverage of the game code (core) by these tests: ./gradlew e2e:test e2e:jacocoTestReport
// -> e2e/build/reports/jacoco/test/html/index.html. Not a gate - a tool to find behaviour no test exercises.
apply plugin: 'jacoco'
jacoco {
    toolVersion = '0.8.16'
}
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    def core = project(':core')
    sourceDirectories.from = files(core.sourceSets.main.java.srcDirs)
    classDirectories.from = files(core.sourceSets.main.output.classesDirs)
    reports {
        xml.required = true
        html.required = true
    }
}
