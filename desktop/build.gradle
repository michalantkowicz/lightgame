apply plugin: 'application'

sourceSets.main.java.srcDirs = ['src/']
sourceSets.main.resources.srcDirs = ['../android/assets']

def assetsDir = rootProject.file('android/assets')
def isMac = System.getProperty('os.name').toLowerCase().contains('mac')
def desktopJvmArgs = ['--enable-native-access=ALL-UNNAMED'] + (isMac ? ['-XstartOnFirstThread'] : [])

application {
    mainClass = 'com.mantkowicz.light.game.desktop.DesktopLauncher'
    applicationName = appName
    // macOS -XstartOnFirstThread is handled at runtime by StartupHelper, keeping start scripts portable
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

// libGDX ships LWJGL 3.3.3, which warns about an unsupported JNI version on JDK 24+; 3.4.x also has the FFM memory backend
// that DesktopLauncher selects on JDK 25+ (no sun.misc.Unsafe warning).
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.lwjgl') useVersion lwjglVersion
    }
}

tasks.named('run', JavaExec) {
    workingDir = assetsDir
    standardInput = System.in
    ignoreExitValue = true
    jvmArgs desktopJvmArgs
}

tasks.register('debug', JavaExec) {
    group = 'application'
    mainClass = application.mainClass
    classpath = sourceSets.main.runtimeClasspath
    workingDir = assetsDir
    standardInput = System.in
    ignoreExitValue = true
    jvmArgs desktopJvmArgs
    debug = true
}

tasks.register('dist', Jar) {
    group = 'distribution'
    description = 'Builds a runnable fat jar.'
    archiveBaseName = appName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED'
    }
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    with jar
}
