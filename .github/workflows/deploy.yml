# Builds the HTML5 version of the game and deploys it to the FTP server.
#
# Same approach as the photos repo: lftp `mirror -R` uploads only new/changed
# files and never deletes anything. Server details live in repo Secrets.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST, FTP_USER, FTP_PASSWORD  - same values as in the photos repo
#   FTP_SERVER_DIR                    - a SEPARATE folder for the game, e.g. /public_html/lightgame

name: Deploy HTML5 game to FTP

# Runs ONLY when you click "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Copy the repository onto the temporary build machine.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java (the build targets Java 17; any JDK >= 17 works).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Set up Gradle with caching of downloaded dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Compile the game to JavaScript with GWT → html/build/dist
      - name: Build HTML5 version
        run: |
          chmod +x gradlew
          ./gradlew html:dist --no-daemon

      # 5. Upload html/build/dist to the server (same lftp settings as photos).
      - name: Upload via lftp
        timeout-minutes: 8
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp <<SCRIPT
          set ssl:verify-certificate false
          set ftp:ssl-protect-data true
          set dns:order "inet"
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST'
          mkdir -p -f '$FTP_SERVER_DIR'
          cd '$FTP_SERVER_DIR'
          mirror -R --verbose html/build/dist/ .
          bye
          SCRIPT
