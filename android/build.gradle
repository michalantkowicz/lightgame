apply plugin: 'com.android.application'

configurations { natives }

def targetJava = (rootProject.property('javaVersion') as String).toInteger()

android {
    namespace = 'com.mantkowicz.light.game'
    compileSdk = 36

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    packaging {
        resources.excludes += ['META-INF/robovm/ios/robovm.xml']
    }
    defaultConfig {
        applicationId = 'com.mantkowicz.light.game'
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(targetJava)
        targetCompatibility = JavaVersion.toVersion(targetJava)
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-$abi"
    }
}

// Extracts the native libraries from the natives configuration into libs/<abi>
// so they get packed into the APK.
tasks.register('copyAndroidNatives') {
    def nativeJars = configurations.natives
    def libsDir = file('libs')
    inputs.files(nativeJars)
    outputs.dir(libsDir)
    doFirst {
        nativeJars.files.each { jar ->
            def abi = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                project.copy {
                    from zipTree(jar)
                    into new File(libsDir, abi)
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}

tasks.register('run', Exec) {
    group = 'application'
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def localProperties = rootProject.file('local.properties')
    if (localProperties.exists()) {
        def props = new Properties()
        localProperties.withInputStream { props.load(it) }
        sdkDir = props.getProperty('sdk.dir') ?: sdkDir
    }
    commandLine "$sdkDir/platform-tools/adb", 'shell', 'am', 'start', '-n',
            'com.mantkowicz.light.game/com.mantkowicz.light.game.AndroidLauncher'
}
