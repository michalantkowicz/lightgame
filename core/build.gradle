sourceSets.main.java.srcDirs = ['src/']

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    api "com.badlogicgames.box2dlights:box2dlights:$box2DLightsVersion"
    api "com.badlogicgames.gdx:gdx-ai:$gdxAiVersion"
}

// Complexity, size and coupling limits (config/pmd.xml, docs/code-quality-plan.md): `./gradlew build` fails on a
// finding; the report is build/reports/pmd/main.html.
apply plugin: 'pmd'
pmd {
    toolVersion = '7.29.0'
    ruleSetFiles = rootProject.files('config/pmd.xml')
    ruleSets = []
    consoleOutput = true
    ignoreFailures = false
}
